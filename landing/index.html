<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="description" content="Moni — the AI agent that trades Coinbase tokenized stocks (B20) on Base from iMessage. Quote, approve, and it executes.">
<title>Moni — Trade Tokenized Stocks by Texting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#fafafa;         /* headline / primary text */
    --muted:#a7a6a6;       /* subcopy */
    --nav:#b6b5b5;         /* header links */
    --strip:#8b8a8a;       /* partner logos */
    --pill:#ffffff;        /* CTA fill */
    --pill-ink:#050505;    /* CTA text */
    --u: calc(100vh / 1058);
    --uw: calc(100vw / 1487);
    --h: clamp(var(--u), calc(var(--u) * .65 + var(--uw) * .35), calc(var(--u) * 1.16));
  }
  @supports (height: 100dvh){ :root{ --u: calc(100dvh / 1058); } }

  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    overflow:hidden;
    background:#050505;
    color:var(--ink);
    font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:geometricPrecision;
    font-weight:400;
  }
  a{ color:inherit; text-decoration:none; }

  .stage{
    position:fixed; inset:0;
    overflow:hidden;
    background:#050505;
    padding-top:env(safe-area-inset-top);
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
  }

  /* ── Background video plane ─────────────────────────────────────────── */
  .plate{ position:absolute; inset:0; }
  .plate-video{
    position:absolute;
    left:50%; top:calc(1 * var(--u));
    width:calc(1492 * var(--u));
    height:calc(1054 * var(--u));
    transform:translateX(calc(-50% - calc(0.5 * var(--u))));
    object-fit:cover;
    pointer-events:none;
  }
  .plate::after{
    content:"";
    position:absolute; inset:0;
    background:
      linear-gradient(to bottom,
        rgba(5,5,5,0) 78.8%, rgba(5,5,5,.23) 79.6%, rgba(5,5,5,.45) 81.4%,
        rgba(5,5,5,.75) 83.3%, rgba(5,5,5,.84) 85.2%, rgba(5,5,5,.888) 88%,
        rgba(5,5,5,.905) 91%, rgba(5,5,5,.96) 95%, #050505 100%),
      linear-gradient(to right,
        #050505 calc(50% - 746*var(--u)),
        transparent calc(50% - 676*var(--u)),
        transparent calc(50% + 676*var(--u)),
        #050505 calc(50% + 746*var(--u)));
  }

  /* ── Header ─────────────────────────────────────────────────────────── */
  .topbar{ position:absolute; inset:0 0 auto 0; height:calc(78 * var(--u)); z-index:40; }
  .brand{
    position:absolute; left:calc(75 * var(--u)); top:calc(27 * var(--u));
    width:calc(31.5 * var(--u)); height:calc(48.5 * var(--u));
    display:block;
  }

  .links{
    position:absolute; left:50%; top:calc(51 * var(--u));
    transform:translate(-50%,-50%);
    display:flex; align-items:center;
    font-size:calc(19 * var(--u)); font-weight:400; color:var(--nav);
    letter-spacing:.02em;
  }
  .links a + a{ margin-left:calc(24.5 * var(--u)); }
  .links a:nth-child(3){ margin-left:calc(23.5 * var(--u)); }
  .links a:nth-child(4){ margin-left:calc(26 * var(--u)); }

  .pill-nav{
    position:absolute; right:calc(75.4 * var(--u)); top:calc(27 * var(--u));
    width:calc(175 * var(--u)); height:calc(49 * var(--u));
    border-radius:999px; background:var(--pill); color:var(--pill-ink);
    display:flex; align-items:center; justify-content:center;
    font-size:calc(20.6 * var(--u)); font-weight:500;
  }
  .pill-nav span{ transform:translateY(1u); }

  /* ── Burger (portrait only) ─────────────────────────────────────────── */
  .burger{
    display:none;
    position:absolute; right:calc((100vw - 100svw) * 0 + 20px); top:20px;
    width:52px; height:52px; border-radius:999px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    cursor:pointer; z-index:60;
  }
  .burger i{
    position:absolute; left:14px; right:14px; height:2px;
    background:var(--ink); border-radius:2px;
    transition:transform .35s cubic-bezier(.22,1,.36,1);
  }
  .burger i:nth-child(1){ top:19px; }
  .burger i:nth-child(2){ bottom:19px; }
  .stage.is-open .burger i:nth-child(1){ transform:rotate(45deg) translateY(calc(4.3 * var(--m,1px))); }
  .stage.is-open .burger i:nth-child(2){ transform:rotate(-45deg) translateY(calc(-4.3 * var(--m,1px))); }

  /* ── Mobile overlay menu ────────────────────────────────────────────── */
  .menu{
    position:absolute; inset:0; z-index:55;
    display:flex;
    background:
      radial-gradient(120% 90% at 70% 0%, rgba(30,30,32,.5), rgba(5,5,5,.92) 60%),
      #050505;
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    opacity:0; visibility:hidden;
    transition:opacity .42s cubic-bezier(.22,1,.36,1), visibility .42s;
    padding:calc(116px) calc(28px) calc(28px + env(safe-area-inset-bottom));
  }
  .menu-inner{ display:flex; flex-direction:column; width:100%; }
  .menu-eyebrow{
    font-size:13px; letter-spacing:.28em; text-transform:uppercase; color:var(--muted);
    margin-bottom:34px; opacity:0; transform:translateY(14px);
  }
  .menu-list{ list-style:none; }
  .menu-list li{
    opacity:0; transform:translateY(14px);
  }
  .menu-list a{
    display:flex; align-items:center; justify-content:space-between;
    font-size:clamp(25px, 31 * var(--m,1px), 34px);
    font-weight:500; color:var(--ink);
    padding:18px 0; border-bottom:1px solid rgba(255,255,255,.08);
  }
  .menu-list a::after{
    content:""; width:9px; height:9px;
    border-top:2px solid var(--muted); border-right:2px solid var(--muted);
    transform:rotate(45deg);
  }
  .menu-foot{
    margin-top:auto;
    display:flex; flex-direction:column; gap:16px;
    opacity:0; transform:translateY(14px);
  }
  .stage.is-open .menu-eyebrow{ transition:opacity .5s cubic-bezier(.22,1,.36,1) .06s, transform .5s cubic-bezier(.22,1,.36,1) .06s; opacity:1; transform:none; }
  .stage.is-open .menu-list li:nth-child(1){ transition:opacity .5s cubic-bezier(.22,1,.36,1) .10s, transform .5s cubic-bezier(.22,1,.36,1) .10s; opacity:1; transform:none; }
  .stage.is-open .menu-list li:nth-child(2){ transition:opacity .5s cubic-bezier(.22,1,.36,1) .16s, transform .5s cubic-bezier(.22,1,.36,1) .16s; opacity:1; transform:none; }
  .stage.is-open .menu-list li:nth-child(3){ transition:opacity .5s cubic-bezier(.22,1,.36,1) .22s, transform .5s cubic-bezier(.22,1,.36,1) .22s; opacity:1; transform:none; }
  .stage.is-open .menu-list li:nth-child(4){ transition:opacity .5s cubic-bezier(.22,1,.36,1) .28s, transform .5s cubic-bezier(.22,1,.36,1) .28s; opacity:1; transform:none; }
  .stage.is-open .menu-foot{ transition:opacity .5s cubic-bezier(.22,1,.36,1) .34s, transform .5s cubic-bezier(.22,1,.36,1) .34s; opacity:1; transform:none; }
  .stage.is-open .menu{ opacity:1; visibility:visible; }

  /* ── Hero ───────────────────────────────────────────────────────────── */
  .hero{ position:absolute; inset:0; z-index:30; }
  .headline{
    position:absolute; left:calc(75.5 * var(--u)); top:calc(230.5 * var(--u));
    font-size:calc(71.6 * var(--h)); line-height:calc(80.5 * var(--h));
    font-weight:400; letter-spacing:calc(.3 * var(--h));
    color:var(--ink); white-space:nowrap;
  }
  .headline span{ display:block; }

  .sub{
    position:absolute; left:calc(75.5 * var(--u));
    top:calc(230.5 * var(--u) + 189.0 * var(--h));
    font-size:calc(20.7 * var(--h)); line-height:calc(23.5 * var(--h));
    font-weight:400; word-spacing:calc(1.8 * var(--h)); color:var(--muted);
    white-space:nowrap;
  }
  .sub span{ display:block; }

  .actions{ position:absolute; left:calc(74.9 * var(--u)); top:calc(230.5 * var(--u) + 264.5 * var(--h)); height:calc(50 * var(--h)); }
  .pill-cta{
    position:absolute; left:0; top:0;
    width:calc(175.6 * var(--h)); height:calc(50 * var(--h));
    border-radius:999px; background:var(--pill); color:var(--pill-ink);
    display:flex; align-items:center; justify-content:center;
    font-size:calc(20.6 * var(--h)); font-weight:500; letter-spacing:.01em;
  }
  .pill-cta span{ transform:translateY(1u); }

  /* ── Entrance animations ────────────────────────────────────────────── */
  @media (prefers-reduced-motion: no-preference){
    @keyframes rise{ from{ opacity:0; transform:translateY(calc(14 * var(--u))); } }
    @keyframes riseNav{
      from{ opacity:0; transform:translate(-50%, calc(-50% + 14 * var(--u))); }
      to  { opacity:1; transform:translate(-50%, -50%); }
    }
    .brand{ animation:rise .8s cubic-bezier(.22,1,.36,1) both; }
    .links{ animation:riseNav .8s cubic-bezier(.22,1,.36,1) both; }
    .pill-nav{ animation:rise .8s cubic-bezier(.22,1,.36,1) both; }
    .headline{ animation:rise .9s cubic-bezier(.22,1,.36,1) .06s both; }
    .sub{ animation:rise .9s cubic-bezier(.22,1,.36,1) .14s both; }
    .pill-cta{ animation:rise .9s cubic-bezier(.22,1,.36,1) .22s both; }
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation:none !important;
      transition-duration:.001s !important;
    }
  }

  /* ── Portrait / narrow ─────────────────────────────────────────────── */
  @media (max-aspect-ratio: 11/10){
    :root{
      --m: min(100vw/430, 1.34px);
      --u: var(--m);
    }
    .stage{ overflow:auto; }
    .plate-video{ inset:0; left:auto; top:auto; width:100%; height:100%; transform:none; object-fit:cover; object-position:43% center; }
    .plate::after{
      background:
        linear-gradient(to right, rgba(5,5,5,.86) 0%, rgba(5,5,5,.66) 42%, rgba(5,5,5,.20) 78%, rgba(5,5,5,.10) 100%),
        linear-gradient(to bottom, rgba(5,5,5,.72) 0%, rgba(5,5,5,.34) 24%, rgba(5,5,5,.34) 56%, rgba(5,5,5,.80) 82%, rgba(5,5,5,.97) 94%, #050505 100%);
    }
    .burger{ display:block; }
    .links, .pill-nav{ display:none; }

    .hero{ position:relative; display:flex; flex-direction:column; align-items:flex-start; justify-content:flex-end; height:100%; min-height:100%; padding:0 calc(24px + env(safe-area-inset-left)) calc(24px + env(safe-area-inset-bottom)); }
    .headline{
      position:relative; left:auto; top:auto;
      font-size:clamp(34px, calc(56 * var(--m)), 60px);
      line-height:1.08; letter-spacing:.01em; white-space:normal; margin-bottom:calc(22 * var(--m));
    }
    .headline span{ display:inline; }
    .sub{
      position:relative; left:auto; top:auto;
      font-size:clamp(15px, calc(16.5 * var(--m)), 18px); line-height:1.45;
      white-space:normal; margin-bottom:calc(34 * var(--m));
    }
    .sub span{ display:inline; }
    .actions{
      position:relative; left:auto; top:auto;
      display:flex; align-items:flex-start; gap:calc(20 * var(--m));
    }
    .pill-cta{ position:relative; width:auto; padding:0 calc(26 * var(--m)); height:calc(50 * var(--m)); border-radius:999px; font-size:clamp(15px, calc(16.5 * var(--m)), 18px); }

    .topbar{ position:absolute; }
    .brand{ left:calc(22px); top:calc(20px); width:24px; height:37px; }

    /* Tablet landscape band */
    @media (min-width:600px){
      :root{
        --m: min(100vw/860, 100vh/760, 1.25px);
      }
      .headline{ font-size:clamp(44px, calc(60 * var(--m)), 72px); }
      .headline span{ display:block; }
      .sub{ font-size:clamp(17px, calc(19 * var(--m)), 21px); }
      .plate-video{ object-position:44% center; }
      .plate::after{
        background:
          linear-gradient(to right, rgba(5,5,5,.84) 0%, rgba(5,5,5,.60) 42%, rgba(5,5,5,.16) 78%, rgba(5,5,5,.06) 100%),
          linear-gradient(to bottom, rgba(5,5,5,.66) 0%, rgba(5,5,5,.28) 24%, rgba(5,5,5,.30) 56%, rgba(5,5,5,.78) 82%, rgba(5,5,5,.96) 94%, #050505 100%);
      }
    }
  }
}
</style>
</head>
<body>
<div class="stage" id="stage">

  <div class="plate" aria-hidden="true">
    <video class="plate-video" autoplay muted loop playsinline preload="auto">
      <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260808_112712_da9d53df-6d27-4b12-bdf6-aa9dc2622bdf.mp4" type="video/mp4">
    </video>
  </div>

  <header class="topbar">
    <a class="brand" href="#" aria-label="Moni home">
      <svg viewBox="0 0 31.5 48.5" width="100%" height="100%" aria-hidden="true">
        <defs>
          <linearGradient id="bg1" x1="8" y1="0" x2="34.1" y2="28.9" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#9e9e9e"/>
            <stop offset=".28" stop-color="#a6a6a6"/>
            <stop offset=".34" stop-color="#a3a3a3"/>
            <stop offset=".40" stop-color="#3a3a3a"/>
            <stop offset=".55" stop-color="#414141"/>
            <stop offset=".60" stop-color="#7a7a7a"/>
            <stop offset=".68" stop-color="#8e8e8e"/>
            <stop offset=".80" stop-color="#a9a9a9"/>
            <stop offset=".95" stop-color="#c4c4c4"/>
            <stop offset="1" stop-color="#cccccc"/>
          </linearGradient>
        </defs>
        <path d="M21.5 0 L21.5 19.5 L31.5 19.5 L31.5 29 L10 48.5 L10 28.5 L0.5 28.5 L0.5 18.5 Z" fill="url(#bg1)"/>
        <rect x="0.5" y="18.5" width="9" height="10" fill="#fdfdfd"/>
        <rect x="22" y="19.5" width="9.5" height="9.5" fill="#fdfdfd"/>
      </svg>
    </a>
    <nav class="links" aria-label="Primary">
      <a href="#about">About</a>
      <a href="#features">Features</a>
      <a href="#faq">FAQ</a>
      <a href="#contact">Contact</a>
    </nav>
    <a class="pill pill-nav" href="#start"><span>Get Started</span></a>
    <button class="burger" id="burger" aria-label="Menu" aria-expanded="false" aria-controls="menu">
      <i></i><i></i>
    </button>
  </header>

  <nav class="menu" id="menu" aria-hidden="true" aria-label="Menu">
    <div class="menu-inner">
      <p class="menu-eyebrow">Menu</p>
      <ul class="menu-list">
        <li><a href="#about">About</a></li>
        <li><a href="#features">Features</a></li>
        <li><a href="#faq">FAQ</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
      <div class="menu-foot">
        <a class="pill pill-cta" href="#start"><span>Start Trading</span></a>
      </div>
    </div>
  </nav>

  <main class="hero">
    <h1 class="headline">
      <span>The Next Layer</span>
      <span>of Trading</span>
    </h1>
    <p class="sub">
      <span>An AI agent that trades Coinbase B20 tokenized stocks on Base,</span>
      <span>right from iMessage &mdash; quote, approve, and it executes.</span>
    </p>
    <div class="actions">
      <a class="pill pill-cta" href="#start"><span>Start Trading</span></a>
    </div>
  </main>

</div>

<script>
(function () {
  var stage = document.getElementById('stage');
  var burger = document.getElementById('burger');
  var menu = document.getElementById('menu');

  function setOpen(open) {
    stage.classList.toggle('is-open', open);
    burger.setAttribute('aria-expanded', String(open));
    menu.setAttribute('aria-hidden', String(!open));
    burger.setAttribute('aria-label', open ? 'Close menu' : 'Menu');
  }

  burger.addEventListener('click', function () {
    setOpen(!stage.classList.contains('is-open'));
  });

  menu.querySelectorAll('a').forEach(function (a) {
    a.addEventListener('click', function () { setOpen(false); });
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && stage.classList.contains('is-open')) setOpen(false);
  });

  window.addEventListener('resize', function () {
    if (window.innerWidth / window.innerHeight > 1.1) setOpen(false);
  });
})();
</script>
</body>
</html>
