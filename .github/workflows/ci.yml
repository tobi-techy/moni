name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint (type check)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run demo (smoke test)
        run: npm run demo
        env:
          DEMO_MODE: 'true'

  docker:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: moni:latest
          load: true

      - name: Test Docker image
        run: |
          docker run --rm -d -p 3000:3000 -e DEMO_MODE=true --name moni-test moni:latest
          sleep 5
          curl -f http://localhost:3000/health
          docker stop moni-test

  deploy-atlasflow:
    needs: docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Install AtlasFlow CLI
        run: |
          curl -fsSL https://atlasflow.com/install.sh | sh
          echo "/usr/local/bin" >> $GITHUB_PATH

      - name: Deploy to AtlasFlow
        env:
          ATLASFLOW_API_KEY: ${{ secrets.ATLASFLOW_API_KEY }}
        run: |
          atlasflow login --key "$ATLASFLOW_API_KEY"
          atlasflow deployments create --project moni --environment production --wait
